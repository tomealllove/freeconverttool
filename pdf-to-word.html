<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF 转 Word · 在线文件工具站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%234f46e5%27/%3E%3Cpath d=%27M9 21l5-12 4 8 2-4h3%27 stroke=%27white%27 stroke-width=%272.2%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="nav-overlay" id="navOverlay"></div>

  <div class="content">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="打开导航">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <b id="topTitle">PDF 转 Word</b>
    </div>

    <div class="content-inner">
      <header class="page-head">
        <div class="page-crumb">PDF 工具 / PDF 转 Word</div>
        <h1 class="page-title">PDF 转 Word</h1>
        <p class="page-desc">在本地提取 PDF 的文本层，按坐标重建行与段落，导出 .docx（可同时导出 TXT），文件不会离开浏览器。</p>
      </header>

      <section class="card">
        <div class="card-title"><span class="step">1</span>上传 PDF</div>
        <div class="dropzone" id="drop" tabindex="0" role="button" aria-label="选择或拖拽 PDF 到此处">
          <input type="file" id="file" accept="application/pdf,.pdf" hidden>
          <div class="dz-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          </div>
          <p class="dz-title">点击选择 PDF，或拖拽文件到此处</p>
          <p class="dz-sub">单个 PDF 不超过 100MB，仅支持带文本层的 PDF</p>
        </div>
        <div class="file-chips" id="fileInfo"></div>
      </section>

      <section class="card">
        <div class="card-title"><span class="step">2</span>转换设置</div>
        <div class="toolbar tight">
          <label class="field field-narrow">
            <span>页码范围</span>
            <input type="text" id="range" placeholder="留空=全部，如 1-5,8">
          </label>
          <label class="checkline"><input type="checkbox" id="paraSplit" checked>按空行分段</label>
          <div class="toolbar-actions">
            <button class="btn btn-ghost" id="reset" disabled>重置</button>
            <button class="btn btn-primary" id="convert" disabled>开始转换</button>
          </div>
        </div>
        <div class="progress" id="progress" hidden>
          <div class="progress-bar"><i></i></div>
          <span class="progress-text">准备中…</span>
        </div>
      </section>

      <div id="tips"></div>

      <div class="result-head">
        <h2>转换结果</h2>
        <span class="muted" id="summary">还没有加载 PDF</span>
      </div>
      <div class="empty" id="empty"><p id="emptyText">上传 PDF 后点击「开始转换」，这里会显示提取到的文本</p></div>

      <section class="card" id="resultCard" hidden>
        <div class="card-title">文本预览</div>
        <div class="stat-row" id="stats"></div>
        <pre class="text-result" id="preview"></pre>
        <div class="toolbar">
          <button class="btn btn-primary" id="downloadDocx" disabled>下载 Word</button>
          <button class="btn" id="downloadTxt" disabled>下载 TXT</button>
          <button class="btn btn-ghost" id="copyText" disabled>复制文本</button>
        </div>
      </section>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/pages/pdf-to-word.js"></script>
</body>
</html>
