<div class="shell" id="shell">

  <div class="content">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="打开导航">

      </button>
      <b id="topTitle">音频格式转换</b>
    </div>

    <div class="content-inner">
      <header class="page-head">
        <div class="page-crumb">转换工具 / 音频格式转换</div>
        <h1 class="page-title">音频格式转换</h1>
        <p class="page-desc">转换音频，原生模式使用在线免费解码器秒开导出 WAV / MP3；高级模式加载 ffmpeg.wasm 支持 OGG / AAC / FLAC 等更多格式。</p>
      </header>

      <section class="card">
        <div class="card-title"><span class="step">1</span>上传音频</div>
        <div class="dropzone" id="drop" tabindex="0" role="button" aria-label="选择或拖拽音频到此处">
          <input type="file" id="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac,.opus,.weba" hidden>
          <div class="dz-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          </div>
          <p class="dz-title">点击选择音频，或拖拽文件到此处</p>
          <p class="dz-sub">支持 MP3 / WAV / OGG / M4A / AAC / FLAC 等，单个文件不超过 200MB</p>
        </div>
        <div class="file-chips" id="fileInfo"></div>
      </section>

      <section class="card">
        <div class="card-title"><span class="step">2</span>参数设置</div>
        <div class="toolbar tight">
          <label class="field field-narrow">
            <span>转换模式</span>
            <select id="mode">
              <option value="native">原生模式（快，浏览器解码）</option>
              <option value="advanced">高级模式（ffmpeg.wasm，全能）</option>
            </select>
          </label>

          <label class="field field-narrow" data-grp="native">
            <span>目标格式</span>
            <select id="nformat">
              <option value="wav">WAV（无损 PCM）</option>
              <option value="mp3">MP3</option>
            </select>
          </label>
          <label class="field field-narrow" data-grp="native">
            <span>采样率</span>
            <select id="nrate">
              <option value="0">保持原样</option>
              <option value="44100">44100 Hz</option>
              <option value="22050">22050 Hz</option>
            </select>
          </label>
          <label class="field field-narrow" data-grp="native" id="nbitrateField" hidden>
            <span>MP3 码率</span>
            <select id="nbitrate">
              <option value="128">128 kbps</option>
              <option value="192" selected>192 kbps</option>
              <option value="320">320 kbps</option>
            </select>
          </label>

          <label class="field field-narrow" data-grp="adv" hidden>
            <span>目标格式</span>
            <select id="aformat">
              <option value="mp3">MP3</option>
              <option value="wav">WAV</option>
              <option value="ogg">OGG（Vorbis）</option>
              <option value="m4a">M4A（AAC）</option>
              <option value="flac">FLAC（无损）</option>
            </select>
          </label>
          <label class="field field-narrow" data-grp="adv" id="abitrateField" hidden>
            <span>码率</span>
            <select id="abitrate">
              <option value="128">128 kbps</option>
              <option value="192" selected>192 kbps</option>
              <option value="320">320 kbps</option>
            </select>
          </label>

          <div class="toolbar-actions">
            <button class="btn btn-ghost" id="reset" disabled>重置</button>
            <button class="btn btn-primary" id="convert" disabled>开始转换</button>
          </div>
        </div>
        <div class="progress" id="progress" hidden>
          <div class="progress-bar"><i></i></div>
          <span class="progress-text">准备中…</span>
        </div>
      </section>

      <div id="tips"></div>

      <div class="result-head">
        <h2>转换结果</h2>
        <span class="muted" id="summary">还没有加载音频</span>
      </div>
      <div class="empty" id="empty"><p id="emptyText">上传音频后设置参数，点击「开始转换」生成结果</p></div>

      <section class="card" id="resultCard" hidden>
        <div class="card-title">结果预览</div>
        <div class="preview-box"><audio id="player" controls></audio></div>
        <div class="stat-row" id="stats"></div>
        <div class="toolbar">
          <button class="btn btn-primary" id="download" disabled>下载</button>
        </div>
      </section>
    </div>
  </div>
