<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF 合并拆分 · 在线文件工具站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%234f46e5%27/%3E%3Cpath d=%27M9 21l5-12 4 8 2-4h3%27 stroke=%27white%27 stroke-width=%272.2%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="nav-overlay" id="navOverlay"></div>

  <div class="content">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="打开导航">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <b id="topTitle">PDF 合并拆分</b>
    </div>

    <div class="content-inner">
      <header class="page-head">
        <div class="page-crumb">PDF 工具 / PDF 合并拆分</div>
        <h1 class="page-title">PDF 合并拆分</h1>
        <p class="page-desc">合并模式可把多个 PDF 按自定义顺序拼成一个；拆分模式可按固定页数或页码范围把一个 PDF 切成多份，全程在浏览器本地完成。</p>
      </header>

      <section class="card">
        <div class="card-title"><span class="step">1</span>上传 PDF</div>
        <div class="toolbar tight">
          <label class="field field-wide">
            <span>工作模式</span>
            <select id="mode">
              <option value="merge">合并模式：多个 PDF → 1 个</option>
              <option value="split">拆分模式：1 个 PDF → 多个</option>
            </select>
          </label>
        </div>
        <div class="dropzone" id="drop" tabindex="0" role="button" aria-label="选择或拖拽 PDF 到此处">
          <input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
          <div class="dz-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          </div>
          <p class="dz-title" id="dzTitle">点击选择多个 PDF，或拖拽文件到此处</p>
          <p class="dz-sub" id="dzSub">每个 PDF 不超过 100MB，可一次选择多个或分次添加</p>
        </div>
        <div class="file-chips" id="chips"></div>
      </section>

      <section class="card">
        <div class="card-title"><span class="step">2</span>处理设置</div>
        <div class="toolbar tight" id="mergeOpts">
          <p class="helper">合并结果按下方列表顺序拼接，可用上移 / 下移调整顺序，或移除不需要的文件。</p>
        </div>
        <div class="toolbar tight" id="splitOpts" hidden>
          <label class="field">
            <span>拆分方式</span>
            <select id="splitBy">
              <option value="every">每段固定页数</option>
              <option value="ranges">自定义页码范围</option>
            </select>
          </label>
          <label class="field field-narrow" id="everyField">
            <span>每段页数</span>
            <input type="number" id="everyN" min="1" max="999" step="1" value="3">
          </label>
          <label class="field field-wide" id="rangesField" hidden>
            <span>页码范围</span>
            <input type="text" id="ranges" placeholder="如 1-3,4-8,9-12">
          </label>
          <p class="helper" id="splitHelp">上传 PDF 后按规则拆分为多个文件。</p>
        </div>
        <div class="toolbar">
          <div class="toolbar-actions">
            <button class="btn btn-ghost" id="clear" disabled>清空</button>
            <button class="btn btn-primary" id="run" disabled>开始处理</button>
          </div>
        </div>
        <div class="progress" id="progress" hidden>
          <div class="progress-bar"><i></i></div>
          <span class="progress-text">准备中…</span>
        </div>
      </section>

      <div id="tips"></div>

      <div class="result-head">
        <h2 id="resultTitle">文件列表</h2>
        <span class="muted" id="summary">还没有添加 PDF</span>
      </div>
      <div class="empty" id="empty"><p id="emptyText">上传 PDF 后，这里会显示待处理的文件</p></div>
      <div class="grid grid-files" id="list"></div>

      <section class="card" id="outCard" hidden>
        <div class="card-title" id="outTitle">处理结果</div>
        <div class="stat-row" id="outStats"></div>
        <div class="grid grid-files" id="splitList"></div>
        <div class="toolbar" id="outActions"></div>
      </section>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/pages/pdf-merge.js"></script>
</body>
</html>
