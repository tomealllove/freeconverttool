  <div class="content">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="打开导航">

    <div class="content-inner">
      <header class="page-head">
        <div class="page-crumb">图片工具 / 图片压缩</div>
        <h1 class="page-title">图片压缩</h1>
        <p class="page-desc">按质量或目标体积压缩图片，支持 JPG / WebP 输出与尺寸限制，可批量处理并打包下载，压缩前后同屏对比，免费快速处理。</p>
      </header>

      <section class="card">
        <div class="card-title"><span class="step">1</span>上传图片</div>
        <div class="dropzone" id="drop" tabindex="0" role="button" aria-label="选择或拖拽图片到此处">
          <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,.png,.jpg,.jpeg,.webp,.gif,.bmp" multiple hidden>
          <div class="dz-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          </div>
          <p class="dz-title">点击选择图片，或拖拽文件到此处</p>
          <p class="dz-sub">支持 PNG / JPG / WebP / GIF / BMP，单张不超过 20MB，可一次选择多张</p>
        </div>
        <div class="file-chips" id="chips"></div>
      </section>

      <section class="card">
        <div class="card-title"><span class="step">2</span>参数设置</div>
        <div class="toolbar tight">
          <label class="field">
            <span>压缩模式</span>
            <select id="mode">
              <option value="quality">质量模式</option>
              <option value="target">目标体积模式</option>
            </select>
          </label>
          <label class="field field-range" id="qualityField">
            <span>输出质量 <b id="qualityVal">75%</b></span>
            <input type="range" id="quality" min="10" max="100" step="1" value="75">
          </label>
          <label class="field" id="formatField">
            <span>输出格式</span>
            <select id="format">
              <option value="keep">保持原格式</option>
              <option value="image/jpeg">JPG</option>
              <option value="image/webp">WebP</option>
            </select>
          </label>
          <label class="field field-narrow" id="maxWField">
            <span>最大边长</span>
            <select id="maxW">
              <option value="0" selected>原尺寸</option>
              <option value="1920">1920 px</option>
              <option value="1280">1280 px</option>
              <option value="800">800 px</option>
            </select>
          </label>
          <label class="field field-narrow" id="targetField" hidden>
            <span>目标体积（KB）</span>
            <input type="number" id="targetKb" min="10" max="20480" step="10" value="200">
          </label>
          <div class="toolbar-actions">
            <button class="btn btn-ghost" id="clear" disabled>清空</button>
            <button class="btn" id="downloadAll" disabled>打包下载</button>
            <button class="btn btn-primary" id="compressAll" disabled>全部压缩</button>
          </div>
        </div>
        <p class="helper" id="modeTip">质量模式：按固定质量重编码，速度快、结果稳定。目标体积模式：自动二分逼近目标大小，最多迭代 6 次。</p>
        <div class="progress" id="progress" hidden>
          <div class="progress-bar"><i></i></div>
          <span class="progress-text">准备中…</span>
        </div>
      </section>

      <div id="tips"></div>

      <div class="result-head">
        <h2>压缩结果</h2>
        <span class="muted" id="summary">还没有添加图片</span>
      </div>
      <div class="stat-row" id="stats" hidden></div>
      <div class="empty" id="empty">
        <p>上传图片后，这里会显示压缩前后的对比与体积缩减比例</p>
      </div>
