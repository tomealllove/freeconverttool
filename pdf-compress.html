<body>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="nav-overlay" id="navOverlay"></div>

  <div class="content">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="打开导航">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <b id="topTitle">PDF 压缩</b>
    </div>

    <div class="content-inner">
      <header class="page-head">
        <div class="page-crumb">PDF 工具 / PDF 压缩</div>
        <h1 class="page-title">PDF 压缩</h1>
        <p class="page-desc">提供轻度压缩（重排结构、去除元数据，文字保持可选）与重印压缩（每页转 JPEG 重印，体积大幅下降但文字变图片）两种方案。</p>
      </header>

      <section class="card">
        <div class="card-title"><span class="step">1</span>上传 PDF</div>
        <div class="dropzone" id="drop" tabindex="0" role="button" aria-label="选择或拖拽 PDF 到此处">
          <input type="file" id="file" accept="application/pdf,.pdf" hidden>
          <div class="dz-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          </div>
          <p class="dz-title">点击选择 PDF，或拖拽文件到此处</p>
          <p class="dz-sub">单个 PDF 不超过 100MB，页数越多耗时越长</p>
        </div>
        <div class="file-chips" id="fileInfo"></div>
      </section>

      <section class="card">
        <div class="card-title"><span class="step">2</span>压缩设置</div>
        <div class="toolbar tight">
          <label class="field">
            <span>压缩档位</span>
            <select id="level">
              <option value="light">轻度压缩（推荐 · 保留文字）</option>
              <option value="reprint">重印压缩（激进 · 文字转图片）</option>
            </select>
          </label>
          <label class="field field-narrow" id="dpiField" hidden>
            <span>重印清晰度</span>
            <select id="dpi">
              <option value="96">96 DPI（体积更小）</option>
              <option value="144" selected>144 DPI（较清晰）</option>
            </select>
          </label>
          <label class="field field-range" id="qualityField" hidden>
            <span>JPEG 质量 <b id="qualityVal">70%</b></span>
            <input type="range" id="quality" min="50" max="80" step="1" value="70">
          </label>
          <div class="toolbar-actions">
            <button class="btn btn-ghost" id="reset" disabled>重置</button>
            <button class="btn btn-primary" id="run" disabled>开始压缩</button>
          </div>
        </div>
        <div class="progress" id="progress" hidden>
          <div class="progress-bar"><i></i></div>
          <span class="progress-text">准备中…</span>
        </div>
      </section>

      <div id="tips"></div>

      <div class="result-head">
        <h2>压缩结果</h2>
        <span class="muted" id="summary">还没有加载 PDF</span>
      </div>
      <div class="empty" id="empty"><p id="emptyText">上传 PDF 后点击「开始压缩」，这里会显示体积对比</p></div>

      <section class="card" id="outCard" hidden>
        <div class="card-title">体积对比</div>
        <div class="stat-row" id="stats"></div>
        <div class="toolbar">
          <button class="btn btn-primary" id="download" disabled>下载压缩后的 PDF</button>
        </div>
      </section>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
