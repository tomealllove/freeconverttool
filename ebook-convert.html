<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>电子书格式互转 · 在线文件工具站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%234f46e5%27/%3E%3Cpath d=%27M9 21l5-12 4 8 2-4h3%27 stroke=%27white%27 stroke-width=%272.2%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="nav-overlay" id="navOverlay"></div>

  <div class="content">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="打开导航">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <b id="topTitle">电子书格式互转</b>
    </div>

    <div class="content-inner">
      <header class="page-head">
        <div class="page-crumb">转换工具 / 电子书格式互转</div>
        <h1 class="page-title">电子书格式互转</h1>
        <p class="page-desc">在浏览器本地转换 EPUB / TXT / HTML：可提取 EPUB 文本、合并为 HTML、由 TXT 生成最小 EPUB，或按文本重排导出 PDF。全部本地处理、文件不上传。</p>
      </header>

      <div id="tips"></div>

      <section class="card">
        <div class="card-title"><span class="step">1</span>上传电子书</div>
        <div class="dropzone" id="drop" tabindex="0" role="button" aria-label="选择或拖拽电子书到此处">
          <input type="file" id="file" accept=".epub,.txt,.html,.htm,application/epub+zip,text/plain,text/html" hidden>
          <div class="dz-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          </div>
          <p class="dz-title">点击选择电子书，或拖拽文件到此处</p>
          <p class="dz-sub">支持 EPUB / TXT / HTML，单个文件不超过 100MB（不支持 MOBI / AZW3）</p>
        </div>
        <div class="file-chips" id="fileInfo"></div>
      </section>

      <section class="card">
        <div class="card-title"><span class="step">2</span>转换设置</div>
        <div class="toolbar tight">
          <label class="field field-wide">
            <span>转换方向</span>
            <select id="direction">
              <option value="epub-txt">EPUB → TXT（提取纯文本）</option>
              <option value="epub-html">EPUB → HTML（合并为单页）</option>
              <option value="txt-epub">TXT / HTML → EPUB（生成最小电子书）</option>
              <option value="to-pdf">EPUB / TXT / HTML → PDF（文本重排）</option>
            </select>
          </label>
          <label class="field field-narrow">
            <span>文本编码</span>
            <label class="checkline"><input type="checkbox" id="gbk">按 GBK 解码</label>
          </label>

          <label class="field field-narrow" data-grp="pdf" hidden>
            <span>字号</span>
            <select id="pFontSize"><option value="12">12</option><option value="14" selected>14</option><option value="16">16</option><option value="18">18</option></select>
          </label>
          <label class="field field-narrow" data-grp="pdf" hidden>
            <span>页边距（pt）</span>
            <select id="pMargin"><option value="36">36</option><option value="48" selected>48</option><option value="64">64</option></select>
          </label>
          <label class="field field-narrow" data-grp="pdf" hidden>
            <span>行高</span>
            <select id="pLineHeight"><option value="1.4">1.4</option><option value="1.6" selected>1.6</option><option value="1.8">1.8</option></select>
          </label>

          <div class="toolbar-actions">
            <button class="btn btn-ghost" id="reset" disabled>重置</button>
            <button class="btn btn-primary" id="convert" disabled>开始转换</button>
          </div>
        </div>
        <div class="progress" id="progress" hidden>
          <div class="progress-bar"><i></i></div>
          <span class="progress-text">准备中…</span>
        </div>
      </section>

      <div class="result-head">
        <h2>转换结果</h2>
        <span class="muted" id="summary">还没有加载电子书</span>
      </div>
      <div class="empty" id="empty"><p id="emptyText">上传电子书后选择方向，点击「开始转换」生成结果</p></div>

      <section class="card" id="resultCard" hidden>
        <div class="card-title">内容预览</div>
        <div class="stat-row" id="stats"></div>
        <pre class="text-result" id="preview"></pre>
        <div class="toolbar">
          <button class="btn btn-primary" id="download" disabled>下载</button>
          <button class="btn btn-ghost" id="copyText" disabled>复制文本</button>
        </div>
      </section>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/pages/ebook-convert.js"></script>
</body>
</html>
