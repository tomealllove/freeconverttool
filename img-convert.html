<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>图片格式化 · 在线文件工具站</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%234f46e5%27/%3E%3Cpath d=%27M9 21l5-12 4 8 2-4h3%27 stroke=%27white%27 stroke-width=%272.2%27 fill=%27none%27 stroke-linecap=%27round%27 stroke-linejoin=%27round%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="shell" id="shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="nav-overlay" id="navOverlay"></div>

  <div class="content">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="打开导航">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <b id="topTitle">图片格式化</b>
    </div>

    <div class="content-inner">
      <header class="page-head">
        <div class="page-crumb">图片工具 / 图片格式化</div>
        <h1 class="page-title">图片格式化</h1>
        <p class="page-desc">在浏览器本地完成 PNG、JPG、WebP、BMP 等常见图片格式互转，可批量处理，支持逐张设置目标格式与输出质量，并对比转换前后的体积。</p>
      </header>

      <section class="card">
        <div class="card-title"><span class="step">1</span>上传图片</div>
        <div class="dropzone" id="drop" tabindex="0" role="button" aria-label="选择或拖拽图片到此处">
          <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp,image/avif,.png,.jpg,.jpeg,.webp,.gif,.bmp,.avif" multiple hidden>
          <div class="dz-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
          </div>
          <p class="dz-title">点击选择图片，或拖拽文件到此处</p>
          <p class="dz-sub">支持 PNG / JPG / WebP / GIF / BMP / AVIF，单张不超过 20MB，可一次选择多张</p>
        </div>
        <div class="file-chips" id="chips"></div>
      </section>

      <section class="card">
        <div class="card-title"><span class="step">2</span>参数设置</div>
        <div class="toolbar tight">
          <label class="field">
            <span>目标格式（全局）</span>
            <select id="format">
              <option value="image/png">PNG（无损）</option>
              <option value="image/jpeg">JPG（体积小）</option>
              <option value="image/webp">WebP（更小）</option>
              <option value="image/bmp">BMP</option>
            </select>
          </label>
          <label class="field field-range" id="qualityField">
            <span>输出质量 <b id="qualityVal">92%</b></span>
            <input type="range" id="quality" min="50" max="100" step="1" value="92">
          </label>
          <div class="toolbar-actions">
            <button class="btn btn-ghost" id="clear" disabled>清空</button>
            <button class="btn" id="downloadAll" disabled>打包下载</button>
            <button class="btn btn-primary" id="convertAll" disabled>全部转换</button>
          </div>
        </div>
        <div class="progress" id="progress" hidden>
          <div class="progress-bar"><i></i></div>
          <span class="progress-text">准备中…</span>
        </div>
      </section>

      <div class="result-head">
        <h2>转换结果</h2>
        <span class="muted" id="summary">还没有添加图片</span>
      </div>
      <div class="empty" id="empty">
        <p>上传图片后，这里会显示原图与转换结果的对比预览</p>
      </div>
      <div class="grid" id="list"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="assets/js/common.js"></script>
<script src="assets/js/pages/img-convert.js"></script>
</body>
</html>
